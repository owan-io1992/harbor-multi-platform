name: Reusable Build Harbor Image

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
jobs:
  build-image:
    runs-on: ubuntu-24.04${{ inputs.arch == 'arm64' && '-arm' || '' }}
    defaults:
      run:
        working-directory: ./harbor
    env:
      DEVFLAG: false
      TRIVYFLAG: true
      PULL_BASE_FROM_DOCKERHUB: false

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: checkout harbor version
        run: |
          set -ex
          git fetch --all --tags --unshallow
          git checkout ${GITHUB_REF_NAME}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: vars
        run: |
          set -ex
          echo "VERSIONTAG=${GITHUB_REF_NAME}_${{ inputs.arch }}" >> $GITHUB_ENV

      - name: patch build parameters
        run: |
          # add label org.opencontainers.image.source = https://github.com/${{ github.repository }}
          sed -i 's|^DOCKERBUILD=$(DOCKERCMD) build --no-cache --network=$(DOCKERNETWORK)|DOCKERBUILD=$(DOCKERCMD) build --no-cache --network=$(DOCKERNETWORK) --label https://github.com/${{ github.repository }} |g' make/photon/Makefile

          # let trivy support multi arch
          case "${{ inputs.arch }}" in
              x64)
              TRIVY_ARCH=64bit
              ;;
              arm64)
              TRIVY_ARCH=ARM64
              ;;
          esac
          sed -i "s|\(trivy_.*_Linux-\)64bit\(.tar.gz\)|\1${TRIVY_ARCH}\2|" Makefile

          # goharbor/photon is amd64-only; replace with official multi-arch photon image on arm64
          if [ "${{ inputs.arch }}" = "arm64" ]; then
            find make/photon -name "Dockerfile.base" \
              -exec sed -i -E 's|FROM goharbor/photon:[^ ]+|FROM photon:5.0|g' {} \;

            # redis 7.2.x (pinned as redis-7.2.11-1.1.1.ph5) is not in the public photon repos;
            # use valkey instead, which ships redis-server/redis-cli symlinks
            if [ -f make/photon/redis/Dockerfile.base ]; then
              sed -i 's|tdnf install -y redis\(-[^ ]*\)\?|tdnf install -y valkey|' make/photon/redis/Dockerfile.base
            fi
          fi

      - name: build images
        run: |
          set -e
          PARM="DEVFLAG=${{ env.DEVFLAG }} \
            TRIVYFLAG=${{ env.TRIVYFLAG }} \
            PULL_BASE_FROM_DOCKERHUB=${{ env.PULL_BASE_FROM_DOCKERHUB }} \
            IMAGENAMESPACE=ghcr.io/${GITHUB_REPOSITORY}"
          make compile -e ${PARM}
          make build -e ${PARM}

      - name: list build images
        run: |
          docker images

      - name: push image to GitHub Container Registry
        run: |
          set -e
          CACHE_SERVICE="redis-photon"
          if [ -d make/photon/valkey ]; then
            CACHE_SERVICE="valkey-photon"
          fi
          images=(nginx-photon harbor-portal harbor-core harbor-jobservice registry-photon harbor-registryctl trivy-adapter-photon harbor-db "${CACHE_SERVICE}" harbor-exporter)

          for image in ${images[@]}; do
            docker push ghcr.io/${GITHUB_REPOSITORY}/${image}:${VERSIONTAG}
          done
